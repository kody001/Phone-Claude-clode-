<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Locked In Place</title>
<style>
@font-face{font-family:"Patrick Hand";src:url(../assets/fonts/PatrickHand.ttf)}
@font-face{font-family:"Permanent Marker";src:url(../assets/fonts/PermanentMarker.ttf)}

canvas{display:block;width:100%;max-width:1280px;margin:0 auto;background:#fff}
