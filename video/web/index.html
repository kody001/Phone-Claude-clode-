<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SpaceX IPO video</title>
<style>
@font-face { font-family: "Patrick Hand"; src: url(fonts/patrick-hand-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Permanent Marker"; src: url(fonts/permanent-marker-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Gochi Hand"; src: url(fonts/gochi-hand-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 600; src: url(fonts/fredoka-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Fredoka"; font-weight: 700; src: url(fonts/fredoka-latin-700-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #fff; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine.js"></script>
<script src="props.js"></script>
<script>
window.READY = (async () => {
  const fonts = ['400 40px "Patrick Hand"', '400 40px "Permanent Marker"', '400 40px "Gochi Hand"', '600 40px Fredoka', '700 40px Fredoka'];
  await Promise.all(fonts.map(f => document.fonts.load(f)));
  await new Promise(r => ELON_IMG.complete ? r() : (ELON_IMG.onload = r));
  TL = await (await fetch('timeline.json')).json();
  prepTokens();
  for (const f of ['kit.js', 'scenes1.js', 'scenes2.js', 'scenes3.js', 'scenes4.js', 'cutaways.js']) {
    const s = document.createElement('script'); s.src = f;
    await new Promise((r, j) => { s.onload = r; s.onerror = j; document.body.appendChild(s); });
  }
  window.DURATION = TL.duration;
  window.NFRAMES = Math.ceil(TL.duration * FPS);
  return true;
})();
</script>
</body>
</html>
