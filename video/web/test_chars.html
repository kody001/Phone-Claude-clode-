<!doctype html><html><head><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import { makeCast } from './js/chars.js';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.setPixelRatio(1);
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; r.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color('#3b1fb0'); s.fog=new THREE.Fog('#3b1fb0',8,22);
const cam=new THREE.PerspectiveCamera(32,W/H,0.1,100);
s.add(new THREE.HemisphereLight('#fff4ff','#6a3bd8',1.6));
const d=new THREE.DirectionalLight('#fff6ee',1.9); d.position.set(3,7,5); d.castShadow=true; d.shadow.mapSize.set(1024,1024); d.shadow.camera.left=-6;d.shadow.camera.right=6;d.shadow.camera.top=6;d.shadow.camera.bottom=-6; s.add(d);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshLambertMaterial({color:'#4a2bd0'})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; s.add(fl);
const cast=makeCast(); const names=Object.keys(cast);
const exprs=['neutral','nervous','laugh','shocked','teeth','love','scared'];
const poses=['stand','pressButton','handsFace','sitKnees','phone','shrug','wave'];
names.forEach((n,i)=>{s.add(cast[n].root);});
window.renderAt=(t, mode)=>{
  names.forEach((n,i)=>{const c=cast[n]; c.apply({pos:[(i-3)*1.35,0,0],rot:0, pose: mode==='poses'?poses[i]:'stand', expr: mode==='poses'?'neutral':exprs[i], mouth: 0},t);});
  if(mode==='close'){cam.fov=28;cam.position.set(-0.6,1.9,3.2);cam.lookAt(-0.8,1.45,0);}
  else {cam.fov=32;cam.position.set(0,1.6,10.5);cam.lookAt(0,1.0,0);} cam.updateProjectionMatrix();
  r.render(s,cam);
};
window.ready=true;
</script></body></html>
