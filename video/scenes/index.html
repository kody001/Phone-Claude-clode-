<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Goldcrest</title>
<style>
@font-face { font-family: 'Fredoka'; font-weight: 500; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-500-normal.woff2); }
@font-face { font-family: 'Fredoka'; font-weight: 600; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2); }
@font-face { font-family: 'Fredoka'; font-weight: 700; src: url(../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2); }
@font-face { font-family: 'DM Serif Display'; font-weight: 400; src: url(../node_modules/@fontsource/dm-serif-display/files/dm-serif-display-latin-400-normal.woff2); }
@font-face { font-family: 'Baloo 2'; font-weight: 800; src: url(../node_modules/@fontsource/baloo-2/files/baloo-2-latin-800-normal.woff2); }
@font-face { font-family: 'Inter'; font-weight: 400; src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url(../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); }
@font-face { font-family: 'Inter'; font-weight: 800; src: url(../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2); }
html, body { margin: 0; background: #000; }
canvas#out { display: block; width: 1920px; height: 1080px; }
</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="out"></canvas>
<script>
// Preload every face so fonts are ready before the first frame.
window.FONTS_LOADED = Promise.all([
  '500 20px Fredoka', '600 20px Fredoka', '700 20px Fredoka', '20px "DM Serif Display"', '800 20px "Baloo 2"', '400 20px Inter', '600 20px Inter', '800 20px Inter'
].map(f => document.fonts.load(f)));
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
